[package]
name = "sponsor-pool"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Pin ed25519-dalek to v2 (rand_core 0.6) — v3 uses rand_core 0.10 which is
# incompatible with soroban-env-host 21.x testutils (ChaCha20Rng mismatch).
ed25519-dalek = "=2.2.0"
proptest = "1.4"
