name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable
  WASM_TARGET: wasm32v1-none

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Rust lint
        run: cargo clippy --workspace --target ${{ env.WASM_TARGET }} --release -- -D warnings

      - name: Rust format check
        run: cargo fmt --check

      - name: Service typecheck (indexer)
        working-directory: services/indexer
        run: |
          npm install
          npx tsc --noEmit

      - name: Service typecheck (relayer)
        working-directory: services/relayer
        run: |
          npm install
          npx tsc --noEmit

      - name: Service typecheck (notifier)
        working-directory: services/notifier
        run: |
          npm install
          npx tsc --noEmit

      - name: Service typecheck (monitor)
        working-directory: services/monitor
        run: |
          npm install
          npx tsc --noEmit

      - name: SDK typecheck
        working-directory: packages/sdk
        run: |
          npm install
          npx tsc --noEmit

      - name: Unified backend typecheck
        working-directory: api
        run: |
          npm install
          npx tsc --noEmit

  # ── Test ──────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Contract unit + proptest
        run: cargo test -p sponsor-pool --lib

      - name: Indexer tests (vitest)
        working-directory: services/indexer
        run: |
          npm install
          npm test

      - name: Relayer tests (vitest)
        working-directory: services/relayer
        run: |
          npm install
          npm test

      - name: Notifier tests (vitest)
        working-directory: services/notifier
        run: |
          npm install
          npm test

      - name: Monitor tests (vitest)
        working-directory: services/monitor
        run: |
          npm install
          npm test

      - name: Unified backend build
        working-directory: api
        run: |
          npm install
          npm run build

  # ── Build WASM ────────────────────────────────────────────────
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}

      - name: Build contract (WASM release)
        run: cargo build -p sponsor-pool --target ${{ env.WASM_TARGET }} --release

      - name: Check WASM size
        run: |
          WASM_FILE="target/${{ env.WASM_TARGET }}/release/sponsor_pool.wasm"
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(wc -c < "$WASM_FILE")
            echo "WASM size: $SIZE bytes ($(( SIZE / 1024 )) KB)"
            if [ "$SIZE" -gt 2097152 ]; then
              echo "❌ WASM exceeds 2MB budget"
              exit 1
            fi
            echo "✅ WASM within budget"
          else
            echo "❌ WASM file not found"
            exit 1
          fi

  # ── Deploy (manual trigger only) ─────────────────────────────
  deploy-testnet:
    name: Deploy → Testnet
    runs-on: ubuntu-latest
    needs: [test, build-wasm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: testnet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}

      - name: Build WASM
        run: cargo build -p sponsor-pool --target ${{ env.WASM_TARGET }} --release

      - name: Install stellar-cli
        run: cargo install stellar-cli --locked 2>/dev/null || echo "stellar-cli already installed"

      - name: Deploy contract
        env:
          SOROBAN_SECRET_KEY: ${{ secrets.SOROBAN_SECRET_KEY }}
        run: |
          echo "$SOROBAN_SECRET_KEY" | stellar keys add deployer --secret-key
          stellar contract deploy \
            --wasm target/${{ env.WASM_TARGET }}/release/sponsor_pool.wasm \
            --source-account deployer \
            --network testnet

  deploy-mainnet:
    name: Deploy → Mainnet
    runs-on: ubuntu-latest
    needs: [test, build-wasm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: mainnet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}

      - name: Build WASM
        run: cargo build -p sponsor-pool --target ${{ env.WASM_TARGET }} --release

      - name: Install stellar-cli
        run: cargo install stellar-cli --locked 2>/dev/null || echo "stellar-cli already installed"

      - name: Deploy contract
        env:
          SOROBAN_SECRET_KEY: ${{ secrets.SOROBAN_SECRET_KEY }}
        run: |
          echo "$SOROBAN_SECRET_KEY" | stellar keys add deployer --secret-key
          stellar contract deploy \
            --wasm target/${{ env.WASM_TARGET }}/release/sponsor_pool.wasm \
            --source-account deployer \
            --network mainnet
