services:
  indexer:
    build:
      context: ./services/indexer
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: .env.production
    volumes:
      - indexer-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  relayer:
    build:
      context: ./services/relayer
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      indexer:
        condition: service_healthy

  notifier:
    build:
      context: ./services/notifier
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    env_file: .env.production
    restart: unless-stopped

  monitor:
    build:
      context: ./services/monitor
      dockerfile: Dockerfile
    env_file: .env.production
    restart: unless-stopped
    volumes:
      - monitor-data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      indexer:
        condition: service_healthy

volumes:
  indexer-data:
  monitor-data:
