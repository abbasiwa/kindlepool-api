# KindlePool unified backend — local/dev compose.
# For production: use MongoDB Atlas (KINDPOOL_MONGO_URL) and Heroku/Vercel.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
    env_file:
      - .env.production
    environment:
      - KINDPOOL_MONGO_URL=mongodb://mongo:27017/kindlepool
      - KINDPOOL_INDEXER_URL=http://localhost:3001
    volumes:
      - backend-data:/app/data
    depends_on:
      - mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  backend-data:
  mongo-data:
