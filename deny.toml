# Cargo Audit — Dependency Vulnerability Scanning
# Run: cargo install cargo-audit && cargo audit

[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"

[licenses]
unlicensed = "deny"
allow = ["MIT", "Apache-2.0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "Unicode-DFS-2016"]
deny = []
copyleft = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
